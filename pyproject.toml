# Workspace root (virtuale): non e un pacchetto pubblicabile.
# I membri sono i pacchetti del monorepo. Vedi docs/architecture.md.

[tool.uv.workspace]
members = ["core", "api", "mcp", "worker", "sdi-inbound"]

[tool.uv.sources]
flow-core = { workspace = true }
flow-api = { workspace = true }
flow-mcp = { workspace = true }
flow-worker = { workspace = true }
flow-sdi-inbound = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "anyio>=4",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "core/src",
    "api/src",
    "mcp/src",
    "worker/src",
    "sdi-inbound/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert and dummy credentials.
"**/tests/**" = ["S101", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "core/src:api/src:mcp/src:worker/src:sdi-inbound/src"

# Untyped third-party libs: pgvector ships no py.typed;
# sentence-transformers is an optional extra (lazily imported).
[[tool.mypy.overrides]]
module = ["pgvector.*", "sentence_transformers.*", "pyotp.*", "qrcode.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["core/tests", "api/tests"]
