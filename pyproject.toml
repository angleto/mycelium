# Workspace root (virtuale): non e un pacchetto pubblicabile.
# I membri sono i pacchetti del monorepo. Vedi docs/architecture.md.

[tool.uv.workspace]
members = ["core", "api", "mcp", "worker", "sdi-inbound", "cli"]

[tool.uv.sources]
mycelium-core = { workspace = true }
mycelium-api = { workspace = true }
mycelium-mcp = { workspace = true }
mycelium-worker = { workspace = true }
mycelium-sdi-inbound = { workspace = true }
mycelium-cli = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "anyio>=4",
    "respx>=0.21",
    # Graph clustering (Leiden) is the garden mindmap's real "glades"
    # source (ADR-0040 / ADR-0031). Production opts in via mycelium-core's
    # ``clustering`` extra (heavy C deps, graceful degrade when absent),
    # but dev and CI install it by default here so the mindmap renders
    # real communities and the cluster tests exercise the live Leiden
    # path instead of the tag-glade fallback.
    "python-igraph>=0.11",
    "leidenalg>=0.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "core/src",
    "api/src",
    "mcp/src",
    "worker/src",
    "sdi-inbound/src",
    "cli/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert and dummy credentials.
"**/tests/**" = ["S101", "S105", "S106", "S107"]
# Alembic migrations build static, authored DDL/DML strings (never
# user input); S608's SQL-injection premise does not apply.
"core/migrations/**" = ["S608"]
# Typer's idiomatic ``param = typer.Option(...) / typer.Argument(...)``
# pattern trips B008 on every command signature. The mutable default
# is also fine: Typer parses each invocation independently and does
# not mutate the sentinel.
"cli/src/mycelium_cli/cmds/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "core/src:api/src:mcp/src:worker/src:sdi-inbound/src:cli/src"

# Untyped third-party libs: pgvector ships no py.typed;
# sentence-transformers is an optional extra (lazily imported);
# reportlab (invoice PDF generator) ships no py.typed; boto3 (S3
# attachment backend, lazily imported) ships no inline types and the
# repo convention is ignore_missing_imports, not a stubs dep.
[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "sentence_transformers.*",
    "pyotp.*",
    "qrcode.*",
    "reportlab.*",
    "boto3.*",
    "lxml.*",
    "igraph.*",
    "leidenalg.*",
    "pywebpush.*",
]
ignore_missing_imports = true

# The test trees are inside the type gate, but only for the checks that
# catch a test which cannot run. A signature change that a test still calls
# the old way is invisible to every other gate: ruff does not know
# signatures, and pytest only finds it by running that one test, which on a
# suite this size means finding it late or not at all (it happened on
# 2026-09-12, when `Embedder.embed` gained a required `side` and one call
# site in a test was missed).
#
# Everything else is OFF here deliberately, because the noise is test idiom
# rather than defect: a `SimpleNamespace` standing in for a model, a `Row`
# fed to `dict`, a helper that returns `object`. Requiring those to type
# would be 955 errors of work to make the doubles less convenient, and
# `arg-type` alone is 763 of them. Full typing of the tests is a separate
# decision, not a prerequisite for closing this hole.
[[tool.mypy.overrides]]
module = [
    "core.tests.*",
    "api.tests.*",
    "worker.tests.*",
    "cli.tests.*",
    "conftest",
    "tests_helpers",
]
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "comparison-overlap",
    "import-untyped",
    "index",
    "misc",
    "no-any-return",
    "no-untyped-call",
    "no-untyped-def",
    "operator",
    "return-value",
    "type-arg",
    "type-var",
    "union-attr",
    "unused-ignore",
    "var-annotated",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["core/tests", "api/tests", "cli/tests", "worker/tests"]
# Warnings are errors. What it cost to get here is the argument for keeping it:
# the run that turned it on found three leaked psycopg connections, a leaked
# asyncpg transport per TestClient-driven probe test, and a redundant Typer flag
# that was already announced for removal. None of those failed anything; all of
# them were visible only as a warning nobody read.
#
# A ResourceWarning is attributed to whatever test the garbage collector happens
# to interrupt, never to the code that leaked. When one appears, bisect by
# running the suspect file together with the test that reported it (`-p
# no:randomly`), not by reading the reported test.
filterwarnings = [
    "error",
    # anyio's memory streams, left unclosed by mcp's STATELESS transport
    # (mcp 1.27.1, anyio 4.13.0). `StreamableHTTPServerTransport.connect()`
    # closes all four streams in a `finally`, but the closes are plain awaits
    # in a task the session manager's task group cancels when the app lifespan
    # exits, so the first one is cancelled and the rest never run. Fixing it
    # means shielding that cleanup, which is inside the library; reaching it
    # from here would mean timing the lifespan exit against a background task,
    # which is a worse thing to own than the warning.
    #
    # WHAT THIS STOPS CATCHING: an unclosed anyio memory stream, from anywhere.
    # Narrow on purpose -- scoped to the message and to the module that raises
    # it -- because the general form would hide the leaked DB connections this
    # gate exists to find. This repository creates no memory object streams of
    # its own (`grep -r create_memory_object_stream` finds none outside the
    # dependency), so today the blast radius is exactly mcp's.
    "ignore:Unclosed <MemoryObject:ResourceWarning:anyio.streams.memory",
]
