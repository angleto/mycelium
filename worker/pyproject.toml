[project]
name = "mycelium-worker"
version = "0.0.0"
description = "Mycelium worker: job in background (sync IMAP, scheduler, memoria, ...)"
requires-python = ">=3.12"
dependencies = [
    "mycelium-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycelium_worker"]
