# Local commit gate that runs the SAME ruff as CI (via uv), so a commit
# can never again drift from `ruff format --check` / `ruff check` — the
# recurring cause of the CI `quality` job going red on tag pushes.
#
# One-time activation (per clone):
#   uv run pre-commit install      # or: uvx pre-commit install
#
# These are `local` / `language: system` hooks on purpose: they invoke
# the project's uv-pinned ruff, so the version that formats here is byte
# identical to the version CI checks with — no pre-commit-vs-uv skew.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-check
        name: ruff check (with --fix)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
