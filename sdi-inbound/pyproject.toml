[project]
name = "flow-sdi-inbound"
version = "0.0.0"
description = "Flow SDI inbound: servizio SOAP sempre attivo per le notifiche SdI"
requires-python = ">=3.12"
dependencies = [
    "flow-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_sdi_inbound"]
