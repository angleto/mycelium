[project]
name = "mycelium-sdi-inbound"
version = "0.0.0"
description = "Mycelium SDI inbound: servizio SOAP sempre attivo per le notifiche SdI"
requires-python = ">=3.12"
dependencies = [
    "mycelium-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycelium_sdi_inbound"]
