# Mirror nvim/flow-nvim/ into github.com/angleto/flow-nvim on every v*
# tag. The standalone plugin repo is what lazy.nvim / packer expect to
# resolve `"angleto/flow-nvim"`; the monorepo is the source of truth.
#
# Setup (one-time):
#   1. Create `github.com/angleto/flow-nvim` (public, empty).
#   2. Create a fine-grained Personal Access Token with `Contents:
#      read+write` on `angleto/flow-nvim` only.
#   3. Save it as a repository secret named `NVIM_PUSH_TOKEN` in this
#      repo.
#
# Without that secret the push step fails fast with a clear error.

name: mirror-flow-nvim

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to mirror (e.g. v2.0.6). Defaults to the latest v* tag."
        required: false
      message:
        description: "Override commit message to use in the plugin repo"
        required: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve target tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
          else
            git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" \
              | awk -F/ '/refs\/tags\/v[0-9]/{print $NF}' \
              | sort -V | tail -1 > /tmp/latest-tag
            TAG=$(cat /tmp/latest-tag)
            if [[ -z "${TAG}" ]]; then
              echo "::error::no v* tag found"
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Mirroring tag: ${TAG}"

      - name: Checkout monorepo @ tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Clone plugin repo
        env:
          NVIM_PUSH_TOKEN: ${{ secrets.NVIM_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NVIM_PUSH_TOKEN}" ]]; then
            echo "::error::NVIM_PUSH_TOKEN secret is not set; cannot push to the plugin repo."
            exit 1
          fi
          git clone --depth=1 \
            "https://x-access-token:${NVIM_PUSH_TOKEN}@github.com/angleto/flow-nvim.git" \
            nvim-repo

      - name: Sync content into plugin repo
        run: |
          set -euo pipefail
          # Wipe everything we own (lua/, plugin/, README) and re-copy
          # from the monorepo subdirectory, so removals propagate too.
          rm -rf nvim-repo/lua nvim-repo/plugin nvim-repo/README.md
          cp -r nvim/flow-nvim/lua nvim-repo/
          cp -r nvim/flow-nvim/plugin nvim-repo/
          cp nvim/flow-nvim/README.md nvim-repo/

      - name: Commit + tag + push if changed
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          OVERRIDE_MSG: ${{ github.event.inputs.message }}
        run: |
          set -euo pipefail
          cd nvim-repo
          git config user.email "ci@flow.xeno.garden"
          git config user.name "Flow CI"
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Content unchanged; only re-tagging."
          else
            git add -A
            if [[ -n "${OVERRIDE_MSG}" ]]; then
              MSG="${OVERRIDE_MSG}"
            else
              MSG="Release ${TAG}"
            fi
            git commit -m "${MSG}"
          fi
          # Mirror the tag too, so lazy.nvim users can pin
          # `version = "v2.0.6"` if they want.
          git tag -f "${TAG}"
          git push origin HEAD:main
          git push -f origin "refs/tags/${TAG}"
