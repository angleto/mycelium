# Flow SPA + same-origin API proxy.
# Mirrors the Vite dev proxy: /api/* → backend with the /api prefix
# stripped (proxy_pass trailing slash), websocket upgrade preserved
# (realtime timer, W4). One public origin, so no CORS is needed.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API → backend Service (ClusterIP). Trailing slash on proxy_pass
    # rewrites /api/tasks → /tasks upstream.
    location /api/ {
        proxy_pass http://flow-backend.flow-production.svc.cluster.local:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (timer stream).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
    }

    # SPA history fallback: every non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: long cache (Vite emits content-hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# $connection_upgrade = "upgrade" when the client asked for it, else
# "close" — required for correct WebSocket proxying.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
