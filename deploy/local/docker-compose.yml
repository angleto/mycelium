# F0 development infra. Multi-arch images (arm64 supported).
# `docker compose -f deploy/local/docker-compose.yml up -d`
# pgvector and pg_trgm are enabled by the baseline Alembic migration.

name: mycelium

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mycelium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mycelium}
      POSTGRES_DB: ${POSTGRES_DB:-mycelium}
    ports:
      - "${MYCELIUM_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mycelium} -d ${POSTGRES_DB:-mycelium}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${MYCELIUM_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

# The application services (api, mcp, worker, sdi-inbound) will be added
# with their Dockerfiles; in F0 they run locally via uv against this
# infra. Known stateful exceptions: db (here), Proton Bridge, sdi-inbound.

volumes:
  pgdata:
