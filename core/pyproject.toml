[project]
name = "flow-core"
version = "0.0.0"
description = "Flow core: dominio + service layer (unico punto di verita)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "cryptography>=43",
    "pgvector>=0.3",
    "reportlab>=4",
]

# Opt-in local embedder (ADR-0012): the privacy-first default runs a
# local sentence-transformers model. Heavy (pulls torch); kept optional
# so CI/dev without it inject a fake embedder. Enable with:
#   uv sync --extra local-embedder
[project.optional-dependencies]
local-embedder = ["sentence-transformers>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_core"]
