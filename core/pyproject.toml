[project]
name = "flow-core"
version = "0.0.0"
description = "Flow core: dominio + service layer (unico punto di verita)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "cryptography>=43",
    "pgvector>=0.3",
    "reportlab>=4",
    "boto3>=1.34",
    "httpx>=0.27",
    "lxml>=5",
    "signxml>=4",
]

# Opt-in local embedder (ADR-0012): the privacy-first default runs a
# local sentence-transformers model. Heavy (pulls torch); kept optional
# so CI/dev without it inject a fake embedder. Enable with:
#   uv sync --extra local-embedder
[project.optional-dependencies]
local-embedder = ["sentence-transformers>=3"]
# Opt-in local speech-to-text (ADR-0020, task 44ba3f14): LocalSTT is
# backed by faster-whisper (CTranslate2). Lazily imported, so CI/dev
# without it inject a fake STT; a deploy that wants Telegram voice
# transcription must ship it. Enable with: uv sync --extra stt
# Model/quantisation via FLOW_STT_MODEL (default small) / FLOW_STT_DEVICE
# / FLOW_STT_COMPUTE_TYPE (default int8).
stt = ["faster-whisper>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_core"]
