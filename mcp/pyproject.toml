[project]
name = "flow-mcp"
version = "0.0.0"
description = "Flow MCP server: adapter sottile su flow-core, pari ad api/"
requires-python = ">=3.12"
dependencies = [
    "flow-core",
    "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_mcp"]
