[project]
name = "mycelium-mcp"
version = "0.0.0"
description = "Mycelium MCP server: adapter sottile su mycelium-core, pari ad api/"
requires-python = ">=3.12"
dependencies = [
    "mycelium-core",
    "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycelium_mcp"]
