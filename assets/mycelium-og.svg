<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Mycelium — the forest of memory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1612"/>
      <stop offset="1" stop-color="#1a2a1f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Faint mycelial network across the field -->
  <g fill="none" stroke="#3a5a30" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <path d="M-20 120 C200 90 380 160 560 120 C760 76 980 150 1220 110"/>
    <path d="M-20 320 C220 300 420 360 620 320 C820 280 1020 350 1220 320"/>
    <path d="M-20 520 C200 500 400 560 600 520 C820 476 1020 540 1220 510"/>
    <path d="M300 90 C320 200 300 300 340 420"/>
    <path d="M620 120 C600 220 640 320 620 460"/>
    <path d="M940 110 C960 220 920 330 960 470"/>
  </g>

  <!-- Mark: mycelial network badge, 11x from the 32-unit grid -->
  <g transform="translate(120 139) scale(11)">
    <rect width="32" height="32" rx="7" fill="#4a6b3e"/>
    <g fill="none" stroke="#fdfcf7" stroke-width="1" stroke-linecap="round">
      <path d="M16 16.5 C13.5 14.5 12 12 11 8.5"/>
      <path d="M12 12 C10 11.5 8 10.5 6 8.5"/>
      <path d="M16 16.5 C18.5 14.5 20 12 21 8.5"/>
      <path d="M20 12 C22 11.5 24 10.5 26 9"/>
      <path d="M16 16.5 C12.5 16.6 9 17 5.5 16"/>
      <path d="M16 16.5 C19.5 16.6 23 17.2 26.5 18.5"/>
      <path d="M16 16.5 C14 19 12 21.5 10 24.5"/>
      <path d="M12.5 21 C11 22.5 9.5 24 8.5 26.5"/>
      <path d="M16 16.5 C18 19.5 19.5 22 20.5 25.5"/>
      <path d="M11 8.5 C14.5 10 17.5 10 21 8.5" stroke-width="0.6" opacity="0.5"/>
      <path d="M10 24.5 C14 26.5 17 26 20.5 25.5" stroke-width="0.6" opacity="0.5"/>
    </g>
    <g fill="#fdfcf7">
      <circle cx="16" cy="16.5" r="1.7"/>
      <circle cx="11" cy="8.5" r="1.1"/><circle cx="6" cy="8.5" r="0.95"/>
      <circle cx="21" cy="8.5" r="1.1"/><circle cx="26" cy="9" r="0.95"/>
      <circle cx="5.5" cy="16" r="1"/><circle cx="26.5" cy="18.5" r="1.05"/>
      <circle cx="10" cy="24.5" r="1.05"/><circle cx="8.5" cy="26.5" r="0.85"/>
      <circle cx="20.5" cy="25.5" r="1.1"/>
    </g>
  </g>

  <!-- Tagline (no wordmark) -->
  <text x="516" y="300" font-family="Georgia, 'Iowan Old Style', ui-serif, serif" font-size="54" font-weight="600" fill="#f0eee5" letter-spacing="-1">the forest of memory</text>
  <text x="518" y="348" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#a3aba0" letter-spacing="0.3">notes • tasks • time • garden</text>
</svg>
