[project]
name = "flow-cli"
version = "2.0.11"
description = "Flow CLI: a keyboard-first terminal client for Flow (tasks, notes, time, calendar)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Angelo Leto", email = "angelo@leto.blue" }]
keywords = ["flow", "cli", "tui", "tasks", "time-tracking", "tmux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "tomli-w>=1.0",
    "pydantic>=2.8",
]

[project.optional-dependencies]
# Voice notes work without this (we shell out to sox/ffmpeg if present)
# but distributions may want a Python-only fallback some day.
voice = []

[project.scripts]
flow = "flow_cli.main:main"

[project.urls]
Homepage = "https://github.com/angleto/flow"
Issues = "https://github.com/angleto/flow/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_cli"]
