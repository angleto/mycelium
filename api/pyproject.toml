[project]
name = "flow-api"
version = "0.0.0"
description = "Flow API: FastAPI REST + WebSocket, adapter sottile su flow-core"
requires-python = ">=3.12"
dependencies = [
    "flow-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "qrcode[pil]>=7.4",
    # WeasyPrint powers /export/pdf (markdown editor → vector PDF).
    # Needs pango/cairo system libs (brew install pango on macOS,
    # libpango-1.0-0 on Debian); the wheel itself is pure-Python.
    "weasyprint>=62",
]

[tool.hatch.build.targets.wheel.force-include]
"src/flow_api/static" = "flow_api/static"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_api"]
