[project]
name = "flow-api"
version = "0.0.0"
description = "Flow API: FastAPI REST + WebSocket, adapter sottile su flow-core"
requires-python = ">=3.12"
dependencies = [
    "flow-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "qrcode[pil]>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_api"]
